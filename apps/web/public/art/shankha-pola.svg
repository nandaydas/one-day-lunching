    </g>
    <g transform="translate(252 150) rotate(12)">
      <ellipse rx="86" ry="86" stroke="#EDE6DA" stroke-width="18"/>
      <ellipse rx="86" ry="86" stroke="#FFFFFF" stroke-width="12"/>
      <ellipse rx="86" ry="86" stroke="#D9CFC0" stroke-width="1.5" stroke-dasharray="3 7"/>
      <ellipse rx="66" ry="66" stroke="#C1121F" stroke-width="12"/>
      <ellipse rx="66" ry="66" stroke="#E0B04A" stroke-width="1.5"/>
    </g>
  </g>
  <!-- sindoor dot -->
